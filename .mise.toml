[env]

# This worktree's named ports, allocated by port-tamer. Until the first task
# needs them the file is simply absent, and the defaults compiled into each
# service apply. Logger4Life-specific URLs and connection strings are derived
# here and by scripts/dev-env.sh rather than stored in port-tamer's state.
_.file = ".port-tamer.env"

BIND_ADDRESS = "127.0.0.1"
BACKEND_URL = "http://localhost:{{env.BACKEND_PORT | default(value='4000')}}"
VITE_URL = "http://localhost:{{env.VITE_PORT | default(value='5173')}}"
TEST_BACKEND_URL = "http://localhost:{{env.TEST_BACKEND_PORT | default(value='4001')}}"
TEST_VITE_URL = "http://localhost:{{env.TEST_VITE_PORT | default(value='5174')}}"
PGHOST = "127.0.0.1"
DATABASE_URL = "postgres://postgres@127.0.0.1:{{env.PGPORT | default(value='5432')}}/logger4life_dev"
TEST_DATABASE_URL = "postgres://postgres@127.0.0.1:{{env.PGPORT | default(value='5432')}}/logger4life_test"

# Database configuration. PGDATA and PGSOCKETDIR are deliberately not set
# here: a PostgreSQL data directory is specific to the platform that created
# it, and one worktree may be opened both natively and in the dev container, so
# scripts/dev-env.sh places the cluster under a platform-specific path.
PGDATABASE = "logger4life_dev"
PGUSER = "postgres"

# Parallel test databases: the primary is migrated once, then copied
# TEST_DATABASE_COUNT times; each PostgreSQL test acquires an exclusive copy.
TEST_DATABASE = "logger4life_test"
TEST_DATABASE_COUNT = "8"

# Keep process-compose's own log next to the worktree it belongs to; the
# default lives in /tmp and would be shared by every worktree.
PC_LOG_FILE = "{{config_root}}/.dev/process-compose.log"

# Tern migration configuration
TERN_CONFIG = "postgresql/tern.conf"
TERN_MIGRATIONS = "postgresql/migrations"

[tools]
fd = "latest"
go = '1.26.4'
nodejs = '24.13.0'
process-compose = "1.122.0"
rg = "latest"

"github:jackc/port-tamer" = "0.1.0"
"github:jackc/tern" = "2.4.3"
"github:jackc/verna" = "0.6.0"
"go:golang.org/x/tools/cmd/goimports" = "latest"

# Tasks are the development interface: native macOS, the dev container, and CI
# all run these same commands. Anything long-running belongs to
# process-compose (see process-compose.yaml); everything here is one-shot.

[tasks."dev:init"]
description = "Prepare this worktree: ports, dependencies, PostgreSQL cluster"
dir = "{{config_root}}"
run = "scripts/dev-init"

[tasks.dev]
description = "Run PostgreSQL, the backend, and Vite under process-compose"
dir = "{{config_root}}"
run = "scripts/dev-up"

[tasks."dev:down"]
description = "Stop this worktree's development stack"
dir = "{{config_root}}"
run = "process-compose down"

[tasks."dev:urls"]
description = "Print this worktree's ports and URLs"
dir = "{{config_root}}"
run = "scripts/dev-urls"

[tasks."dev:ports:reset"]
description = "Choose a new port group for this worktree (stop its services first)"
dir = "{{config_root}}"
run = ["port-tamer allocate --overwrite", "scripts/dev-urls"]

[tasks."db:init"]
description = "Create and migrate this worktree's PostgreSQL cluster"
dir = "{{config_root}}"
run = "scripts/db-init"

[tasks."db:reset"]
description = "Drop and rebuild this worktree's databases"
dir = "{{config_root}}"
run = "scripts/db-reset"

[tasks."db:migrate"]
description = "Run pending migrations against the development database"
dir = "{{config_root}}"
depends = ["db:ensure"]
run = "scripts/dev-exec tern migrate"

[tasks."db:psql"]
description = "Open psql against the development database"
dir = "{{config_root}}"
depends = ["db:ensure"]
run = "scripts/dev-exec psql"
interactive = true

[tasks."db:ensure"]
description = "Start this worktree's PostgreSQL cluster if necessary"
dir = "{{config_root}}"
run = "scripts/db-ensure-running"
hide = true

[tasks."build:binary"]
description = "Build the logger4life binary for the current platform"
dir = "{{config_root}}"
sources = ["*.go", "**/*.go", "!**/*_test.go", "go.mod", "go.sum"]
outputs = ["build/logger4life"]
run = ["mkdir -p build", "go build -o build/logger4life"]

[tasks."build:assets"]
description = "Build the frontend assets"
dir = "{{config_root}}"
sources = [
  "src/**/*",
  "static/**/*",
  "package.json",
  "package-lock.json",
  "svelte.config.js",
  "vite.config.js",
]
outputs = ["build/assets/.built"]
run = ["npm run build", "touch build/assets/.built"]

[tasks.build]
description = "Build the frontend assets and the Go binary"
dir = "{{config_root}}"
run = [{ tasks = ["build:binary", "build:assets"] }]

[tasks."build:linux-amd64"]
description = "Build the linux/amd64 release archive"
dir = "{{config_root}}"
depends = ["build:assets"]
run = "scripts/build-release linux amd64"

[tasks."build:linux-arm64"]
description = "Build the linux/arm64 release archive"
dir = "{{config_root}}"
depends = ["build:assets"]
run = "scripts/build-release linux arm64"

[tasks."build:darwin-amd64"]
description = "Build the darwin/amd64 release archive"
dir = "{{config_root}}"
depends = ["build:assets"]
run = "scripts/build-release darwin amd64"

[tasks."build:darwin-arm64"]
description = "Build the darwin/arm64 release archive"
dir = "{{config_root}}"
depends = ["build:assets"]
run = "scripts/build-release darwin arm64"

[tasks.clean]
alias = "clobber"
description = "Remove build artifacts"
dir = "{{config_root}}"
run = "rm -rf build"

[tasks."test:prepare"]
description = "Prepare the PostgreSQL test databases"
dir = "{{config_root}}"
depends = ["db:ensure"]
sources = [
  "postgresql/**/*.sql",
  "test/*.sql",
  "test/testdata/*.sql",
  "scripts/db-ensure-running",
  "scripts/db-init",
  "scripts/dev-env.sh",
  "scripts/dev-exec",
  "scripts/dev-urls",
  "port-tamer.toml",
]
outputs = ["tmp/test/.databases-prepared"]
run = [
  "mkdir -p tmp/test",
  "scripts/dev-exec psql --no-psqlrc -v ON_ERROR_STOP=1 -f test/setup_test_databases.sql > /dev/null",
  "touch tmp/test/.databases-prepared",
]

[tasks.test]
description = "Run the backend and browser test suites"
dir = "{{config_root}}"
run = [{ task = "test:backend" }, { task = "test:browser" }]

[tasks."test:backend"]
description = "Run Go tests against PostgreSQL, jed, and the dual comparison adapter"
dir = "{{config_root}}"
depends = ["test:prepare"]
run = [
  "scripts/dev-exec go test ./...",
  "scripts/dev-exec env LOGGER4LIFE_TEST_BACKEND=jed go test ./backend/server/",
  "scripts/dev-exec env LOGGER4LIFE_TEST_BACKEND=both go test ./backend/server/",
]

[tasks."test:browser"]
description = "Run the Playwright browser tests"
dir = "{{config_root}}"
depends = ["test:prepare"]
run = "scripts/dev-exec npm test"
