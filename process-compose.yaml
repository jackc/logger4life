# The shared service catalog for one worktree. Mise owns finite developer
# tasks; process-compose is the only component that launches shared services.
# Profiles are expressed as namespaces and acquired through scripts/services:
#
#   db    PostgreSQL with roles, databases, and migrations ready
#   test  every service required by the test tasks
#   dev   the interactive backend and Vite development stack
#
# Nothing here is worktree-specific: every port and path arrives through the
# environment, so the same file serves every worktree, macOS, and the dev
# container.

version: "0.5"
is_strict: true
ordered_shutdown: true

processes:
  postgres:
    command: scripts/postgres
    namespace: [db, test, dev]
    disabled: true
    readiness_probe:
      exec:
        command: scripts/postgres-ready
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 30
    # SIGINT is PostgreSQL's fast shutdown: roll back open transactions and
    # exit, rather than waiting for clients to disconnect.
    shutdown:
      signal: 2
      timeout_seconds: 20
    availability:
      restart: on_failure
      max_restarts: 3
    log_location: .dev/logs/postgres.log

  database-ready:
    command: scripts/db-bootstrap
    namespace: [db, test, dev]
    disabled: true
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"
    log_location: .dev/logs/database-ready.log

  services-db-ready:
    command: "true"
    namespace: db
    disabled: true
    depends_on:
      database-ready:
        condition: process_completed_successfully
    availability:
      restart: "no"

  services-test-ready:
    command: "true"
    namespace: test
    disabled: true
    depends_on:
      database-ready:
        condition: process_completed_successfully
    availability:
      restart: "no"

  backend:
    command: >
      go run . server
      --bind-address "$BIND_ADDRESS"
      --port "$BACKEND_PORT"
      --allow-registration
      --webauthn-rp-id localhost
      --webauthn-origin "$VITE_URL"
      --log-format text
    namespace: dev
    disabled: true
    watch:
      paths:
        - path: main.go
        - path: backend
        - path: go.mod
        - path: go.sum
    depends_on:
      database-ready:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${BACKEND_PORT}
        path: /health
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 60
    availability:
      restart: on_failure
      max_restarts: 3
    log_location: .dev/logs/backend.log

  vite:
    command: npm run dev
    namespace: dev
    disabled: true
    depends_on:
      backend:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: ${VITE_PORT}
        path: /
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 3
    log_location: .dev/logs/vite.log

  services-dev-ready:
    command: "true"
    namespace: dev
    disabled: true
    depends_on:
      vite:
        condition: process_healthy
    availability:
      restart: "no"
